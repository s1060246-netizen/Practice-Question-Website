<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>整合行銷模擬測驗</title>
<style>
:root{
  --bg:#FBF1EF; --card:#FFFFFF; --primary:#C68D84; --light:#EDBBB2; --soft:#D3A5A7;
  --accent:#A06761; --text:#4F3236; --deep:#5A2E29; --ok:#5F8366; --bad:#A33B34; --line:#EBD3CF;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#2A1A1C; --card:#3A2528; --text:#F3DDD9; --line:#5A3A3D; --light:#6B4044; --deep:#EDBBB2; --ok:#8DB594; --bad:#E58A82; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;line-height:1.75;font-size:17px}
header{background:var(--deep);color:#FBF1EF;padding:18px 20px}
header h1{margin:0;font-size:1.25rem;letter-spacing:.08em;max-width:720px;margin-inline:auto}
@media (prefers-color-scheme: dark){ header{background:#1E1214;color:#EDBBB2} }
main{max-width:720px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
h2{margin:0 0 .6em;font-size:1.3rem;color:var(--deep)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);padding:9px 18px}
button:hover:not(:disabled){background:var(--light);color:var(--deep)}
button:disabled{opacity:.4;cursor:default}
button.main{background:var(--accent);color:#fff}
button.main:hover:not(:disabled){background:var(--deep);color:#fff}
button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.choices{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
.choices label{cursor:pointer}
.choices input{position:absolute;opacity:0}
.choices span{display:inline-block;padding:8px 18px;border:1.5px solid var(--soft);border-radius:8px}
.choices input:checked+span{background:var(--primary);border-color:var(--primary);color:#fff}
.choices input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--primary);transition:width .2s}
.meta{font-size:.9rem;opacity:.8;margin-bottom:6px}
.q{font-size:1.1rem;font-weight:600;margin:0 0 16px}
.opt{display:block;width:100%;text-align:left;margin-bottom:10px;border-color:var(--soft);color:var(--text);padding:11px 14px}
.opt.sel{background:var(--light);border-color:var(--accent);color:var(--deep)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:20px}
.grid button{width:36px;height:36px;padding:0;font-size:.85rem;border-color:var(--soft);color:var(--text)}
.grid button.done{background:var(--soft);color:#fff;border-color:var(--soft)}
.grid button.cur{border-color:var(--deep);border-width:2.5px}
.score{font-size:3.4rem;line-height:1.1;color:var(--deep);margin:4px 0}
.item{border-top:1px solid var(--line);padding:14px 0}
.item p{margin:.2em 0}
.bad{color:var(--bad)} .ok{color:var(--ok)}
.hide{display:none}
</style>
</head>
<body>
<header><h1>整合行銷管理師・模擬測驗</h1></header>
<main id="app"></main>
<script>

["食品業結合零售業將巧克力推廣為情人節代表性的禮品，此乃屬於哪一種行銷策略？",["轉換行銷","刺激行銷","開發行銷","維持行銷"],"B"],
["「橘色商機」指 50 歲以上熟齡人口，其人生像進入秋天燦爛的楓葉般，這個年齡層的人口特徵是：有錢、空巢期、消費意願高、敢嘗新、善待自己；針對階層人口推廣保健商品、深度旅遊、高階網購……，此乃屬於哪一種行銷策略？",["轉換行銷","刺激行銷","開發行銷","維持行銷"],"C"],
["愛之味鮮採番茄汁利用先進技術改變配方，讓番茄汁變好喝了，此乃屬於哪一種行銷策略？",["轉換行銷","刺激行銷","開發行銷","維持行銷"],"A"],
["Gummy Bears 推出兒童維他命軟糖，讓排斥藥味的小朋友願意吃維他命，此乃屬於哪一種行銷策略？",["轉換行銷","刺激行銷","開發行銷","維持行銷"],"A"],
["政府強力取締毒品，此乃屬於哪一種行銷策略？",["轉換行銷","低行銷","反行銷","維持行銷"],"C"],
["以下對市場哲學的演進敘述何者為非？",["起始於生產觀念","銷售觀念在於雙贏","行銷觀念在於滿足消費者需求","現在強調社會行銷觀念"],"B"],

["以下對行銷概念的敘述何者為非？",["行銷管理亦可稱為顧客管理與需求管理","差異化與市場定位是行銷管理重要的議題","行銷可以創造顧客的需要","顧客關係的建立基礎在顧客價值與滿意度"],"C"]

const L=["A","B","C","D"], app=document.getElementById("app");
let list=[], ans=[], cur=0, count=20;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}

function home(){
  const opts=[10,20,Q.length].map(n=>`<label><input type="radio" name="n" value="${n}" ${n===count?"checked":""}><span>${n===Q.length?"全部 "+n:n} 題</span></label>`).join("");
  app.innerHTML=`<div class="card"><h2>第一篇　行銷管理概論</h2>
  <p>每次從 ${Q.length} 題中隨機抽題，作答完交卷後會顯示分數與答錯的題目。選項順序不會打亂。</p>
  <div class="choices" role="radiogroup" aria-label="題數">${opts}</div>
  <button class="main" id="go">開始測驗</button></div>`;
  document.getElementById("go").onclick=()=>{
    count=+document.querySelector("input[name=n]:checked").value;
    list=shuffle(Q).slice(0,count); ans=Array(count).fill(null); cur=0; quiz();
  };
}

function quiz(){
  const [q,o]=list[cur], done=ans.filter(x=>x).length;
  app.innerHTML=`<div class="card">
  <div class="bar"><i style="width:${done/count*100}%"></i></div>
  <div class="meta">第 ${cur+1} / ${count} 題　已作答 ${done} 題</div>
  <p class="q">${esc(q)}</p>
  ${o.map((t,i)=>`<button class="opt ${ans[cur]===L[i]?"sel":""}" data-k="${L[i]}">（${L[i]}）${esc(t)}</button>`).join("")}
  <div class="nav"><button id="prev" ${cur===0?"disabled":""}>上一題</button>
  ${cur<count-1?'<button class="main" id="next">下一題</button>':'<button class="main" id="submit">交卷</button>'}</div>
  <div class="grid">${list.map((_,i)=>`<button data-i="${i}" class="${ans[i]?"done":""} ${i===cur?"cur":""}" aria-label="第 ${i+1} 題">${i+1}</button>`).join("")}</div>
  <div class="nav"><button id="quit">放棄並回首頁</button>${cur<count-1?'<button id="submit2">提前交卷</button>':'<span></span>'}</div></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ans[cur]=b.dataset.k;quiz()});
  app.querySelectorAll(".grid button").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;quiz()});
  const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=f};
  on("prev",()=>{cur--;quiz()}); on("next",()=>{cur++;quiz()});
  on("submit",submit); on("submit2",submit);
  on("quit",()=>{if(confirm("確定放棄這次測驗嗎？"))home()});
}

function submit(){
  const blank=ans.filter(x=>!x).length;
  if(blank&&!confirm(`還有 ${blank} 題未作答，確定交卷嗎？`))return;
  const wrong=[]; list.forEach((it,i)=>{if(ans[i]!==it[2])wrong.push(i)});
  const right=count-wrong.length, score=Math.round(right/count*100);
  app.innerHTML=`<div class="card"><h2>測驗結果</h2>
  <div class="score">${score} 分</div>
  <p>答對 ${right} 題，答錯或未答 ${wrong.length} 題，共 ${count} 題。</p>
  <button class="main" id="again">重新開始</button></div>
  ${wrong.length?`<div class="card" style="margin-top:16px"><h2>需要檢討的題目</h2>${wrong.map(i=>{const [q,o,k]=list[i],a=ans[i];
    return `<div class="item"><p><b>${esc(q)}</b></p>
    <p class="bad">你的答案：${a?`（${a}）${esc(o[L.indexOf(a)])}`:"未作答"}</p>
    <p class="ok">正確答案：（${k}）${esc(o[L.indexOf(k)])}</p></div>`}).join("")}</div>`:'<p class="ok" style="margin-top:16px">全部答對！</p>'}`;
  document.getElementById("again").onclick=home;
  window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
